[project]
name = "aggregator"
version = "0.1.0"
description = "Multi-site sportswear product aggregator"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
aggregator = "aggregator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aggregator*"]
